name: iOS Native Build

on:
  push:
    branches:
      - main
      - feature/ios-native-app
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-build.yml"
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios-native
        run: |
          xcodebuild             -project NgayXinh.xcodeproj             -scheme NgayXinh             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             clean build

      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: NgayXinh-XcodeProject
          path: ios-native/NgayXinh.xcodeproj
